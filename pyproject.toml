[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-orm-bench"
version = "0.1.0"
description = "SQLite write throughput benchmarks: ORM vs raw SQL across 11 PRAGMA configurations at 10M-50M row scale"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Tanay Kedia" }]
requires-python = ">=3.11"
keywords = ["sqlite", "benchmark", "sqlalchemy", "orm", "performance", "wal"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "sqlalchemy>=2.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["ruff", "black", "pytest"]

[project.scripts]
sqlite-bench-scale = "sqlite_bench.scale_benchmark:main"
sqlite-bench-compare = "sqlite_bench.before_after:main"
sqlite-bench-report = "sqlite_bench.report:main"

[project.urls]
Homepage = "https://github.com/TanayK07/sqlite-orm-bench"
Issues = "https://github.com/TanayK07/sqlite-orm-bench/issues"

[tool.setuptools.packages.find]
include = ["sqlite_bench*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
